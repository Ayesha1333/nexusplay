services:
  gaming-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gaming-app:latest
    container_name: gaming-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=change-this-to-a-random-secret-key-in-production
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - gaming-network

networks:
  gaming-network:
    driver: bridge
